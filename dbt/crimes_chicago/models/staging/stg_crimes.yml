version: 2

models:
  - name: stg_crimes
    description: >
      Camada de staging sobre a source raw.crimes_raw. Um registro por
      crime, deduplicado por id mantendo a versão com updated_at mais recente.
    columns:
      - name: id
        description: Chave natural do crime na fonte (campo "ID" do portal de Chicago).
        tests:
          - unique
          - not_null
      - name: date
        description: Timestamp do crime.
        tests:
          - not_null
      - name: is_arrest
        tests:
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_domestic
        tests:
          - accepted_values:
              arguments:
                values: [true, false]

  - name: int_tipo_crime_atual
    description: >
      Estado atual (1 linha por IUCR) usado como fonte do snapshot
      dim_tipo_crime_snapshot para gerar a SCD Tipo 2.
    columns:
      - name: iucr
        tests: [unique, not_null]
